[project]
name = "roto-plus"
version = "0.1.0"
description = "Roto-Plus: stroke-based rotoscoping with optical flow, edge snapping and SAM2"
requires-python = ">=3.10,<3.11"
dependencies = [
    # --- deep learning stack (CUDA builds pinned via [tool.uv.sources]) ---
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.42.4",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    # --- SAM2 (installed as editable from ./sam2_git, see [tool.uv.sources]) ---
    "sam-2",
    # --- numerics ---
    "numpy>=1.24.4,<2.0",
    "scipy>=1.10.0",
    "numba>=0.59.0",
    "opencv-python>=4.9.0",
    "pillow>=9.4.0",
    # --- config / io ---
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    # --- GUI ---
    "pyside6>=6.6.0",
    "ultralytics>=8.4.182",
    "einops>=0.8.2",
    "timm>=1.0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# expose the project's own modules (utils/reasoning/windows) into the venv as an
# editable install, so entry scripts in any subfolder can `import utils` directly
include = ["utils*", "reasoning*", "windows*"]
namespaces = true

[tool.uv]
# conda migration: everything is managed by uv from here on

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
# SAM2 lives in the repo as a source tree (skip its CUDA extension build on Windows)
sam-2 = { path = "sam2_git", editable = true }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
